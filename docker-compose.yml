# console-stack public：单机独立安装（PostgreSQL 16 + kernel public 镜像）。
# 安装 / 升级步骤见 docs/install.md、docs/upgrade.md。
# - console 默认 build target 为 `public`（不含任何私人插件或 personal-workbench）；
#   设置 CONSOLE_IMAGE 为已发布镜像（如 ghcr.io/isdoge/console-stack-public:sha-<commit>）
#   时可直接 `docker compose pull` 使用，不必本地构建。
# - PG 管理员密码只经 secrets 文件（./secrets/pg-admin.password），不进环境变量；
#   运行账号（受限 DML）密码来自 .env 的 CONSOLE_PG_PASSWORD。
# - Web 只绑定宿主回环 127.0.0.1；需要局域网访问请自行加反代与鉴权。
name: console-stack-public

services:
  console-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${CONSOLE_PG_DB:-console}
      POSTGRES_USER: ${CONSOLE_PG_ADMIN_USER:-console_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/console_pg_admin
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    secrets:
      - console_pg_admin
    volumes:
      - console-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONSOLE_PG_ADMIN_USER:-console_admin} -d ${CONSOLE_PG_DB:-console}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - console-net

  # 一次性管理工具：组件 schema 迁移/核对与运行账号授权（管理员连接，读 secrets 文件）。
  # 用法：docker compose run --rm console-schema migrate|check|grant-app-role ...
  console-schema:
    image: ${CONSOLE_IMAGE:-console-stack-public:local}
    profiles: ["tools"]
    depends_on:
      console-postgres:
        condition: service_healthy
    working_dir: /workspace
    entrypoint:
      - sh
      - -c
      - 'CONSOLE_PG_PASSWORD="$$(cat /run/secrets/console_pg_admin)" exec python scripts/pg_component_schema.py "$$@"'
      - pg_component_schema
    environment:
      CONSOLE_PG_HOST: console-postgres
      CONSOLE_PG_PORT: "5432"
      CONSOLE_PG_DB: ${CONSOLE_PG_DB:-console}
      CONSOLE_PG_USER: ${CONSOLE_PG_ADMIN_USER:-console_admin}
      CONSOLE_APP_ROLE_PASSWORD: ${CONSOLE_PG_PASSWORD:?缺 CONSOLE_PG_PASSWORD（运行账号密码，见 .env.example）}
    secrets:
      - console_pg_admin
    volumes:
      - ./:/workspace:ro
    networks:
      - console-net

  console:
    image: ${CONSOLE_IMAGE:-console-stack-public:local}
    build:
      context: .
      dockerfile: console/Dockerfile
      # 公共默认：kernel + 合同级空插件根 + 空台账（不含私人插件/personal-workbench）。
      target: public
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      CONSOLE_AUTH_ENABLED: ${CONSOLE_AUTH_ENABLED:-false}
      CONSOLE_AUTH_USER: ${CONSOLE_AUTH_USER:-admin}
      CONSOLE_AUTH_PASSWORD: ${CONSOLE_AUTH_PASSWORD:-}
      CONSOLE_STORAGE_ENGINE: postgres
      # 单机独立实例即权威端（authority）：本机采集与业务写入。
      CONSOLE_INSTANCE_ROLE: authority
      CONSOLE_MAINTENANCE_MODE: ${CONSOLE_MAINTENANCE_MODE:-normal}
      CONSOLE_PG_HOST: console-postgres
      CONSOLE_PG_PORT: "5432"
      CONSOLE_PG_DB: ${CONSOLE_PG_DB:-console}
      CONSOLE_PG_USER: ${CONSOLE_PG_USER:-console_app}
      CONSOLE_PG_PASSWORD: ${CONSOLE_PG_PASSWORD:?缺 CONSOLE_PG_PASSWORD（运行账号密码，见 .env.example）}
      CONSOLE_MONITORING_ENROLL_TOKEN: ${CONSOLE_MONITORING_ENROLL_TOKEN:-}
      HINDSIGHT_PROXY_PORT: "0"
    volumes:
      - console-data:/app/data
    depends_on:
      console-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONSOLE_HTTP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - console-net

volumes:
  console-pgdata:
  console-data:

networks:
  console-net:
    driver: bridge

secrets:
  console_pg_admin:
    file: ./secrets/pg-admin.password
