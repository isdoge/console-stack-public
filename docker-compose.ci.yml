# PG-04（提案 §6.2/§10.2）：CI/本地校验用的 compose 覆盖文件。
# 用法：docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
# 目的：`config` 校验不依赖 NAS IP 绑定与生产 secret 文件——PG 管理员密码
# 指向仓库内的占位文件（无真实值）；生产部署仍用基础文件的 /vol1 路径。
# CI 的 PG 测试不走本文件的容器，而是 GitHub Actions services（见 ci.yml）。
services:
  console-postgres:
    ports: !override []
secrets:
  console_pg_admin:
    file: ./scripts/fixtures/pg-admin-password.placeholder
